<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billing - Sunrise Dental Clinic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar-root" class="no-print"></div>
<div id="mobile-nav-root" class="no-print"></div>
<div class="content">
  <div class="content-inner">
    <p class="eyebrow no-print">Front Desk</p>
    <h1 class="page-title no-print">Calculate and print bill</h1>
    <div class="card no-print">
      <form id="billForm">
        <label for="number">Appointment number</label>
        <input id="number" class="mono" placeholder="e.g. APT1001" required>
        <button type="submit">Calculate bill</button>
      </form>
      <p id="msg" class="message" role="status"></p>
    </div>

    <div class="card" id="billCard" style="display:none;">
      <h2 class="no-print">Bill / Receipt</h2>
      <div class="bill-box" id="billBox">
        <div class="clinic-name">Sunrise Dental Clinic</div>
        <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">Official Receipt</div>
        <div class="line"><span>Appointment No.</span><span class="ref-badge" id="bNumber"></span></div>
        <div class="line"><span>Patient</span><span id="bPatient"></span></div>
        <div class="line"><span>Dentist</span><span id="bDentist"></span></div>
        <div class="line"><span>Treatment</span><span id="bTreatment"></span></div>
        <div class="line"><span>Consultation fee</span><span class="mono">Rs. <span id="bBase"></span></span></div>
        <div class="line"><span>Discount</span><span class="mono"><span id="bDiscountPercent"></span>% (Rs. <span id="bDiscountAmount"></span>)</span></div>
        <div class="total"><span>Total payable</span><span>Rs. <span id="bTotal"></span></span></div>
        <div style="font-size:11px; color:var(--muted); margin-top:12px; font-family:var(--font-mono);">Generated: <span id="bGenerated"></span></div>
      </div>
      <button class="secondary no-print" style="margin-top:16px;" onclick="window.print()">Print bill</button>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  Api.requireLogin();

  document.getElementById("billForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    try {
      const b = await Api.getAuthed("/api/bill", { number: document.getElementById("number").value });
      document.getElementById("bNumber").textContent = b.appointmentNumber;
      document.getElementById("bPatient").textContent = b.patientName;
      document.getElementById("bDentist").textContent = b.dentistName;
      document.getElementById("bTreatment").textContent = b.treatmentName;
      document.getElementById("bBase").textContent = b.baseFee.toFixed(2);
      document.getElementById("bDiscountPercent").textContent = b.discountPercent;
      document.getElementById("bDiscountAmount").textContent = b.discountAmount.toFixed(2);
      document.getElementById("bTotal").textContent = b.totalAmount.toFixed(2);
      document.getElementById("bGenerated").textContent = b.generatedAt;
      document.getElementById("billCard").style.display = "block";
      showMessage(msg, "", false);
    } catch (err) {
      document.getElementById("billCard").style.display = "none";
      showMessage(msg, err.message, true);
    }
  });
</script>
</body>
</html>
