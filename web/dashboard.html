<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - Sunrise Dental Clinic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar-root"></div>
<div id="mobile-nav-root"></div>
<div class="content">
  <div class="content-inner">
    <p class="eyebrow">Front Desk</p>
    <h1 class="page-title" id="greeting">Welcome back</h1>

    <div class="stat-row" id="statRow" style="display:none;">
      <div class="stat-card"><div class="num" id="statTotal">-</div><div class="lbl">Total appointments</div></div>
      <div class="stat-card"><div class="num" id="statRevenue">-</div><div class="lbl">Est. revenue (Rs.)</div></div>
      <div class="stat-card"><div class="num" id="statDentists">-</div><div class="lbl">Dentists on roster</div></div>
    </div>

    <div class="card">
      <h2>Quick actions</h2>
      <div class="menu-grid" id="menuGrid"></div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  Api.requireLogin();
  document.getElementById("greeting").textContent = "Welcome back, " + (Api.getFullName() || "there").split(" ")[0];

  const commonTiles = [
    { href: "register-appointment.html", label: "Register New Appointment", icon: "plus" },
    { href: "search-appointment.html", label: "Search Appointment", icon: "search" },
    { href: "billing.html", label: "Calculate and Print Bill", icon: "bill" },
    { href: "help.html", label: "Help", icon: "help" }
  ];
  const adminTiles = [
    { href: "admin-staff.html", label: "Manage Staff Accounts", icon: "staff" },
    { href: "admin-dentists.html", label: "Manage Dentists", icon: "tooth" },
    { href: "admin-treatments.html", label: "Manage Treatment Types", icon: "bill" },
    { href: "admin-reports.html", label: "View Reports", icon: "reports" }
  ];

  const tiles = Api.getRole() === "ADMIN" ? adminTiles.concat(commonTiles) : commonTiles;
  const grid = document.getElementById("menuGrid");
  tiles.forEach(t => {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = t.href;
    a.innerHTML = '<span class="tile-icon">' + ClinicIcons[t.icon] + '</span><span>' + t.label + '</span>';
    grid.appendChild(a);
  });

  if (Api.getRole() === "ADMIN") {
    Api.getAuthed("/api/reports/summary").then(r => {
      document.getElementById("statTotal").textContent = r.totalAppointments;
      document.getElementById("statRevenue").textContent = Number(r.estimatedTotalRevenue).toLocaleString();
      document.getElementById("statDentists").textContent = Object.keys(r.appointmentsPerDentist || {}).length || "-";
      document.getElementById("statRow").style.display = "grid";
    }).catch(() => {});
  }
</script>
</body>
</html>
