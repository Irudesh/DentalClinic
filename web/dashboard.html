<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - Sunrise Dental Clinic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>Sunrise Dental Clinic</h1>
  <nav>
    <span id="whoami" style="margin-right:16px; font-size:14px;"></span>
    <a href="help.html">Help</a>
    <a href="#" id="logoutLink">Exit / Logout</a>
  </nav>
</header>
<main>
  <div class="card">
    <h2>Main menu</h2>
    <div class="menu-grid" id="menuGrid"></div>
  </div>
</main>
<script src="js/api.js"></script>
<script>
  Api.requireLogin();
  document.getElementById("whoami").textContent =
    (Api.getFullName() || "Staff") + " (" + Api.getRole() + ")";

  const commonTiles = [
    { href: "register-appointment.html", label: "Register New Appointment" },
    { href: "search-appointment.html", label: "Search Appointment" },
    { href: "billing.html", label: "Calculate and Print Bill" },
    { href: "help.html", label: "Help" }
  ];
  const adminTiles = [
    { href: "admin-staff.html", label: "Manage Staff Accounts" },
    { href: "admin-dentists.html", label: "Manage Dentists" },
    { href: "admin-treatments.html", label: "Manage Treatment Types" },
    { href: "admin-reports.html", label: "View Reports" }
  ];

  const tiles = Api.getRole() === "ADMIN" ? adminTiles.concat(commonTiles) : commonTiles;
  const grid = document.getElementById("menuGrid");
  tiles.forEach(t => {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = t.href;
    a.textContent = t.label;
    grid.appendChild(a);
  });

  document.getElementById("logoutLink").addEventListener("click", async (e) => {
    e.preventDefault();
    try { await Api.postAuthed("/api/logout", {}); } catch (err) {}
    Api.clearSession();
    window.location.href = "login.html";
  });
</script>
</body>
</html>
