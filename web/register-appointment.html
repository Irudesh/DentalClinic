<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register Appointment - Sunrise Dental Clinic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar-root"></div>
<div id="mobile-nav-root"></div>
<div class="content">
  <div class="content-inner">
    <p class="eyebrow">Front Desk</p>
    <h1 class="page-title">Register new appointment</h1>
    <div class="card">
      <form id="apptForm">
        <label for="patientName">Patient name</label>
        <input id="patientName" required>
        <label for="address">Address</label>
        <input id="address">
        <label for="contactNumber">Contact number</label>
        <input id="contactNumber" required>
        <label for="dentistId">Dentist</label>
        <select id="dentistId" required></select>
        <label for="treatmentTypeId">Treatment type</label>
        <select id="treatmentTypeId" required></select>
        <label for="date">Appointment date</label>
        <input id="date" type="date" required>
        <label for="time">Appointment time</label>
        <input id="time" type="time" required>
        <label for="discountPercent">Discount % (optional)</label>
        <input id="discountPercent" type="number" min="0" max="100" step="1" value="0">
        <button type="submit">Register appointment</button>
      </form>
      <p id="msg" class="message" role="status"></p>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  Api.requireLogin();

  async function loadOptions() {
    const dentists = await Api.getAuthed("/api/dentists");
    const dentistSelect = document.getElementById("dentistId");
    dentists.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.name + " (" + d.specialization + ")";
      dentistSelect.appendChild(opt);
    });

    const treatments = await Api.getAuthed("/api/treatmenttypes");
    const treatmentSelect = document.getElementById("treatmentTypeId");
    treatments.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.name + " - Rs. " + t.fee;
      treatmentSelect.appendChild(opt);
    });
  }
  loadOptions();

  document.getElementById("apptForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    try {
      const data = await Api.postAuthed("/api/appointments", {
        patientName: document.getElementById("patientName").value,
        address: document.getElementById("address").value,
        contactNumber: document.getElementById("contactNumber").value,
        dentistId: document.getElementById("dentistId").value,
        treatmentTypeId: document.getElementById("treatmentTypeId").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        discountPercent: document.getElementById("discountPercent").value
      });
      showMessage(msg, "Appointment registered successfully. Number: " + data.appointmentNumber, false);
      document.getElementById("apptForm").reset();
    } catch (err) {
      showMessage(msg, err.message, true);
    }
  });
</script>
</body>
</html>
